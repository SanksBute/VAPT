# SentinelX AI — Docker Compose (Development)
# Run: docker compose up -d
# Version: 1.0.0

name: sentinelx-dev

services:
  # ─── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx_dev_password
      POSTGRES_DB: sentinelx
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sentinelx-network

  # ─── Redis ─────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinelx-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass sentinelx_redis_password
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfilename appendonly.aof
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "sentinelx_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx-network

  # ─── RabbitMQ ─────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: sentinelx-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: sentinelx
      RABBITMQ_DEFAULT_PASS: sentinelx_rabbit_password
      RABBITMQ_DEFAULT_VHOST: sentinelx
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit consumer_timeout 86400000"
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping", "-q"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sentinelx-network

  # ─── OpenSearch ─────────────────────────────────────────────
  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: sentinelx-opensearch
    restart: unless-stopped
    environment:
      - cluster.name=sentinelx-cluster
      - node.name=sentinelx-node1
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=Sxr7Kq2vLpN9wZt!
      - plugins.security.disabled=true  # Dev mode only
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:9200 | grep -q 200"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - sentinelx-network

  # ─── MinIO (Object Storage) ─────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: sentinelx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sentinelx_minio
      MINIO_ROOT_PASSWORD: sentinelx_minio_password
      MINIO_SITE_NAME: sentinelx
    ports:
      - "9000:9000"
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - sentinelx-network

  # ─── MinIO Setup (creates initial buckets) ──────────────────
  minio-setup:
    image: minio/mc:latest
    container_name: sentinelx-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set sentinelx http://minio:9000 sentinelx_minio sentinelx_minio_password;
      mc mb --ignore-existing sentinelx/reports;
      mc mb --ignore-existing sentinelx/evidence;
      mc mb --ignore-existing sentinelx/avatars;
      mc mb --ignore-existing sentinelx/exports;
      mc mb --ignore-existing sentinelx/scanner-output;
      mc policy set download sentinelx/avatars;
      echo 'MinIO setup complete';
      "
    networks:
      - sentinelx-network

  # ─── Ollama (Local AI) ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: sentinelx-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai-local
    networks:
      - sentinelx-network

  # ─── API Gateway ────────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
      target: development
    container_name: sentinelx-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://sentinelx:sentinelx_dev_password@postgres:5432/sentinelx?schema=public
      REDIS_URL: redis://:sentinelx_redis_password@redis:6379
      RABBITMQ_URL: amqp://sentinelx:sentinelx_rabbit_password@rabbitmq:5672/sentinelx
      OPENSEARCH_URL: http://opensearch:9200
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: sentinelx_minio
      MINIO_SECRET_KEY: sentinelx_minio_password
      MINIO_USE_SSL: "false"
      OLLAMA_BASE_URL: http://ollama:11434
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
      - "9229:9229"  # Debug port
    volumes:
      - ./apps/api-gateway/src:/app/apps/api-gateway/src
      - ./packages:/app/packages
    command: npm run dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - sentinelx-network

  # ─── Frontend (Next.js) ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: sentinelx-web
    restart: unless-stopped
    depends_on:
      - api-gateway
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
      NEXT_PUBLIC_APP_NAME: SentinelX AI
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/public:/app/apps/web/public
    command: npm run dev
    networks:
      - sentinelx-network

  # ─── Prometheus ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: sentinelx-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    profiles:
      - monitoring
    networks:
      - sentinelx-network

  # ─── Grafana ────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    container_name: sentinelx-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: sentinelx_grafana_password
      GF_SERVER_ROOT_URL: http://localhost:3002
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3002:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    profiles:
      - monitoring
    depends_on:
      - prometheus
    networks:
      - sentinelx-network

  # ─── NGINX (reverse proxy for dev) ──────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sentinelx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
      - web
    profiles:
      - proxy
    networks:
      - sentinelx-network

volumes:
  postgres_data:
    name: sentinelx_postgres_data
  redis_data:
    name: sentinelx_redis_data
  rabbitmq_data:
    name: sentinelx_rabbitmq_data
  opensearch_data:
    name: sentinelx_opensearch_data
  minio_data:
    name: sentinelx_minio_data
  ollama_data:
    name: sentinelx_ollama_data
  prometheus_data:
    name: sentinelx_prometheus_data
  grafana_data:
    name: sentinelx_grafana_data

networks:
  sentinelx-network:
    name: sentinelx-network
    driver: bridge
