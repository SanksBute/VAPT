apiVersion: v2
name: sentinelx
description: SentinelX AI — Enterprise AI-Powered Offensive Security Platform
type: application
version: 1.0.0
appVersion: "1.0.0"
keywords:
  - security
  - vapt
  - vulnerability-management
  - ai
  - cybersecurity
home: https://sentinelx.io
sources:
  - https://github.com/sentinelx/sentinelx
maintainers:
  - name: SentinelX Team
    email: platform@sentinelx.io
dependencies:
  - name: postgresql
    repository: https://charts.bitnami.com/bitnami
    version: "^15.5.0"
    condition: postgresql.enabled
  - name: redis
    repository: https://charts.bitnami.com/bitnami
    version: "^19.6.0"
    condition: redis.enabled
  - name: rabbitmq
    repository: https://charts.bitnami.com/bitnami
    version: "^14.6.0"
    condition: rabbitmq.enabled
